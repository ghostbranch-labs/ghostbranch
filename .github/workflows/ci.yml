name: ci

# Linux only, to save Actions minutes. Windows and macOS are tested on the
# maintainers' own machines before a merge.
#
# Three jobs run in parallel: lint, vuln, and test, a matrix. The test
# matrix splits ./internal/engine into shards by the first letter after
# "Test" (each shard's run pattern); the "other" shard runs every other
# package. internal/cishard's test fails if an engine test is in no shard
# or in two, so a test added later can't drop out of CI. To rebalance, move
# a boundary letter and rename the shard to match: keep the ranges
# contiguous, from A to Z. The shard names are the check names on the PR.
on:
  pull_request:
  push:
    branches: [main]
    # Markdown-only commits go straight to main and need no CI. Pull requests always run, because the Ghostbranch gate
    # waits for their checks.
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
  # release.yml calls this before a release: Markdown-only commits on main
  # skip CI on push, so the tagged commit is always tested here.
  workflow_call:

permissions:
  contents: read

# When jobs run. Actions minutes are free on a public repo and billed on a
# private one (GitHub Free), so the jobs skip on private repos:
#  - Here, on the public repo, every job runs on pull requests and on pushes
#    to main. Pushes also run on a release tag (release.yml calls this
#    workflow from a tag push).
#  - On a private repo, push runs skip. That covers sync's pushes to the
#    private shadow repo's main, which start nothing. The first two
#    comparisons are the push guard ghostbranch audit suggests, so the audit
#    stops reporting this file.
#  - test-arm64 and npm-test also skip on a private repo for any event, so
#    they skip on the shadow repo's gate runs too.
#  - The last clause skips every job on a pull request in a private repo
#    named ghostbranch. It only matters if this repo is ever private again:
#    promote publishes exactly the commits the gate already tested in the
#    shadow repo. The check uses the repo's short name, which the gate's
#    guard rewrite leaves alone, so gates still run in full.
#  - goreleaser-check runs on pull requests only.

jobs:
  lint:
    if: (github.event_name != 'push' || github.repository == 'ghostbranch-labs/ghostbranch' && !github.event.repository.private || startsWith(github.ref, 'refs/tags/')) && !(github.event_name == 'pull_request' && github.event.repository.private && github.event.repository.name == 'ghostbranch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

  vuln:
    if: (github.event_name != 'push' || github.repository == 'ghostbranch-labs/ghostbranch' && !github.event.repository.private || startsWith(github.ref, 'refs/tags/')) && !(github.event_name == 'pull_request' && github.event.repository.private && github.event.repository.name == 'ghostbranch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          # Every job's setup-go cache shares one key, and the first job to
          # finish saves it. This one builds nothing of ours, so it saves
          # nothing, which leaves the key to a job whose build cache helps.
          cache: false
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  test:
    name: test (${{ matrix.shard }})
    if: (github.event_name != 'push' || github.repository == 'ghostbranch-labs/ghostbranch' && !github.event.repository.private || startsWith(github.ref, 'refs/tags/')) && !(github.event_name == 'pull_request' && github.event.repository.private && github.event.repository.name == 'ghostbranch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: engine-a-f, pkg: ./internal/engine, run: '^Test[A-F]' }
          - { shard: engine-g-r, pkg: ./internal/engine, run: '^Test[G-R]' }
          - { shard: engine-s-z, pkg: ./internal/engine, run: '^Test[S-Z]' }
          - { shard: other, pkg: ./..., run: '' }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: go test
        env:
          PKG: ${{ matrix.pkg }}
          RUN: ${{ matrix.run }}
        run: |
          if [ "$PKG" = ./internal/engine ]; then
            go test -timeout 25m -run "$RUN" ./internal/engine
          else
            go test $(go list ./... | grep -v '/internal/engine$')
          fi

  # linux/arm64 ships, and nobody here has an ARM Linux machine, so CI runs
  # the whole suite on one.
  test-arm64:
    if: ((github.event_name != 'push' || github.repository == 'ghostbranch-labs/ghostbranch' && !github.event.repository.private || startsWith(github.ref, 'refs/tags/')) && !github.event.repository.private) && !(github.event_name == 'pull_request' && github.event.repository.private && github.event.repository.name == 'ghostbranch')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: go test
        run: go test -timeout 40m ./...

  # On a pull request that touches the release config or workflow, go.mod
  # or go.sum (a dependency can break a darwin or windows build, and CI is
  # otherwise Linux only), or packaging/, install/, npm/ or publish.yml:
  # check the config and build a snapshot of all five platforms (no signing,
  # no SBOMs, nothing published).
  goreleaser-check:
    if: (github.event_name == 'pull_request' && (github.event_name != 'push' || github.repository == 'ghostbranch-labs/ghostbranch')) && !(github.event_name == 'pull_request' && github.event.repository.private && github.event.repository.name == 'ghostbranch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: changed release files?
        id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          files=$(git diff --name-only "$BASE"...HEAD) || exit 1
          if printf '%s\n' "$files" | grep -qxE '\.goreleaser\.yaml|\.github/workflows/(release|publish)\.yml|go\.mod|go\.sum|(packaging|install|npm)/.*'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        if: steps.changed.outputs.run == 'true'
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        if: steps.changed.outputs.run == 'true'
        with:
          distribution: goreleaser
          version: v2.18.3
          args: check
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        if: steps.changed.outputs.run == 'true'
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --snapshot --clean --skip=sign,sbom
      # The snapshot's archives go through the same render and npm build that
      # publish.yml runs on a release. A snapshot version has "+" build
      # metadata (0.0.1-devel+<sha>), left raw in the rendered URLs; that is
      # fine because a snapshot is never published (render route refuses any
      # tag but vX.Y.Z or vX.Y.Z-rc.N).
      - name: render and build the npm packages from the snapshot
        if: steps.changed.outputs.run == 'true'
        run: |
          v=$(grep -o '"version": *"[^"]*"' dist/metadata.json | head -1 | sed 's/.*"\([^"]*\)"$/\1/')
          go run ./packaging/render render -version "$v" -checksums dist/checksums.txt -out rendered
          node npm/build.mjs --version "$v" --assets dist --out npm-out
          for d in npm-out/*/; do (cd "$d" && npm pack --dry-run > /dev/null); done
          grep -cE '  install\.(sh|ps1)$' dist/checksums.txt | grep -qx 2

  # The npm launcher and build script (Node's own test runner; no
  # dependencies). The install script tests run in the Go jobs.
  npm-test:
    if: ((github.event_name != 'push' || github.repository == 'ghostbranch-labs/ghostbranch' && !github.event.repository.private || startsWith(github.ref, 'refs/tags/')) && !github.event.repository.private) && !(github.event_name == 'pull_request' && github.event.repository.private && github.event.repository.name == 'ghostbranch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: node --test
        run: node --test npm/build.test.mjs npm/launcher.test.mjs
