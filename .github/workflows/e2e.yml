name: e2e

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-sandbox
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    # The sandbox token lives in this environment, which needs the
    # maintainer's approval for each run (Settings → Environments → e2e).
    environment: e2e
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go test -tags e2e -count=1 -timeout 35m -v ./internal/e2e/
        env:
          GHOSTBRANCH_E2E_TOKEN: ${{ secrets.GHOSTBRANCH_E2E_TOKEN }}
