name: release

# A maintainer pushes a tag vX.Y.Z (or vX.Y.Z-rc.N) on main. CI runs first;
# then GoReleaser builds five platforms, writes checksums and SBOMs, signs
# the checksums with cosign (keyless) and creates a DRAFT release, which the
# maintainer reviews and publishes. See RELEASING.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    # Never in a fork or in the Ghostbranch shadow repo.
    if: github.repository == 'ghostbranch-labs/ghostbranch'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    if: github.repository == 'ghostbranch-labs/ghostbranch'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Limited to v* tags in the repo settings: only a tag run reaches its
    # secrets (none yet; 6.4b-2 adds the tap, bucket and npm ones).
    environment: release
    permissions:
      contents: write      # create the draft release
      id-token: write      # cosign keyless and attestations
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0   # the changelog reads tags
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: verify the signature we just made
        env:
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          cosign verify-blob \
            --bundle dist/checksums.txt.sigstore.json \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            dist/checksums.txt
      # GitHub attests public repos only (private needs Enterprise Cloud), so
      # this switches itself on when the repo goes public.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
